<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title data-i18n="title">Toshiieとの日程調整</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007aff'/><rect x='22' y='30' width='56' height='48' rx='8' fill='white'/><rect x='22' y='30' width='56' height='14' rx='6' fill='%23ff3b30'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar" id="navbar">
  <span class="navbar-title" id="navTitle" aria-hidden="true" data-i18n="title">Toshiieとの日程調整</span>
  <div class="lang" id="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ja" lang="ja">日本語</button>
    <button type="button" data-lang="en" lang="en">EN</button>
  </div>
</nav>

<main id="main">
  <header class="hero">
    <p class="eyebrow" id="owner">&nbsp;</p>
    <h1 class="large-title" id="largeTitle" data-i18n="heading">日程調整</h1>
    <p class="hero-sub" data-i18n="sub">ご都合のよい日時をお選びください。塩見に連絡が行きます</p>
    <ul class="meta">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="metaDuration">—</span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><select id="tz" class="tz-select" aria-label="Time zone"><option value="Asia/Tokyo" data-i18n="tzJst">日本時間 (JST)</option><option value="Europe/Berlin" data-i18n="tzBerlin">ドイツ時間 (CET/CEST)</option></select></li>
    </ul>
  </header>

  <section class="section" aria-labelledby="durLabel">
    <h2 class="section-header" id="durLabel" data-i18n="duration">所要時間</h2>
    <div class="card stepper-card">
      <div class="stepper-value">
        <span class="stepper-num" id="durValue" aria-live="polite">—</span>
        <span class="stepper-range" id="durRange"></span>
      </div>
      <div class="stepper" role="group" aria-labelledby="durLabel">
        <button type="button" id="durMinus" aria-label="30分短くする"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
        <span class="stepper-divider" aria-hidden="true"></span>
        <button type="button" id="durPlus" aria-label="30分長くする"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>
  </section>

  <section class="section" aria-labelledby="dateLabel">
    <div class="section-row">
      <h2 class="section-header" id="dateLabel" data-i18n="date">日付</h2>
      <span class="section-aside" id="monthLabel"></span>
    </div>
    <div class="card date-card">
      <div class="dates" id="days" role="listbox" aria-labelledby="dateLabel"></div>
    </div>
  </section>

  <section class="section" aria-labelledby="timeLabel">
    <div class="section-row">
      <h2 class="section-header" id="timeLabel" data-i18n="time">時間</h2>
      <span class="section-aside" id="dayLabel"></span>
    </div>
    <div id="slots"></div>
    <p class="empty" id="status" hidden></p>
  </section>

  <footer class="footer" data-i18n="footer">カレンダーの空き状況はリアルタイムで反映されます。</footer>
</main>

<!-- 予約シート -->
<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber" aria-hidden="true"></div>

  <div id="sheetForm">
    <div class="sheet-bar">
      <button type="button" class="bar-button" id="cancel" data-i18n="cancel">キャンセル</button>
      <h2 class="sheet-title" id="sheetTitle" data-i18n="confirm">予約の確認</h2>
      <span class="bar-spacer"></span>
    </div>

    <div class="summary">
      <div class="summary-icon" aria-hidden="true">
        <span class="summary-month" id="sumMonth"></span>
        <span class="summary-day" id="sumDay"></span>
      </div>
      <div>
        <div class="summary-date" id="sumDate"></div>
        <div class="summary-time" id="sumTime"></div>
      </div>
    </div>

    <form id="form" novalidate>
      <div class="list">
        <label class="list-row">
          <span class="list-label" data-i18n="name">お名前</span>
          <input name="name" required maxlength="100" autocomplete="name" data-i18n-ph="namePh" placeholder="山田 太郎">
        </label>
        <label class="list-row">
          <span class="list-label" data-i18n="email">メール</span>
          <input name="email" type="email" required maxlength="200" autocomplete="email" inputmode="email" placeholder="name@example.com">
        </label>
      </div>
      <div class="list">
        <label class="list-row list-row-stack">
          <span class="list-label" data-i18n="note">メモ（任意）</span>
          <textarea name="note" rows="3" maxlength="1000" data-i18n-ph="notePh" placeholder="ご用件など"></textarea>
        </label>
      </div>
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="form-error" id="formError" role="alert"></p>
      <button type="submit" class="button-filled" id="submit">
        <span class="spinner" aria-hidden="true"></span><span class="label" data-i18n="book">予約する</span>
      </button>
    </form>
  </div>

  <div id="sheetDone" class="done" hidden>
    <svg class="done-check" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/>
    </svg>
    <h2 class="done-title" data-i18n="doneTitle">予約が完了しました</h2>
    <p class="done-text" id="doneText"></p>
    <p class="done-note" id="doneNote" data-i18n="doneNote">この画面のスクリーンショットを保存しておくと安心です。</p>
    <button type="button" class="button-tinted" id="doneClose" data-i18n="close">閉じる</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
